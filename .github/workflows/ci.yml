name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Ten-Layer Gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install devDependencies
        run: npm install --no-audit --no-fund

      # ── 以下 6 个门禁按依赖顺序串行执行 ──
      # 注意：本项目实测并行跑多个 node 进程会触发测试文件被杀的环境性假红，
      # 因此严禁并发，一律用独立 step 顺序串联。

      # 守护：十层源码（src/L2..L10）不得出现浏览器/Node 双端不兼容的危险语法
      # （如 with/eval、new Function、已废弃 API 等），保证 file:// 直开可用。
      - name: 层文件静态检查 / Layer lint
        run: npm run lint

      # 守护：L10 微指令集登记数量。1024 项 ISA 中已落地的微指令数必须达标，
      # 防止新增算子时忘记登记进 ISA 登记中心导致"有实现无编号"。
      - name: 微指令覆盖率 / Micro-ISA coverage
        run: npm run isa

      # 守护：12 项核心不变量（RNG 确定性、softmax 行和、LN 归一化、因果掩码、
      # 中心差分梯度检验、过拟合收敛、KV cache 逐位一致、存档往返等）。
      # 这是整个引擎的数学正确性底线。
      - name: 自检套件 / Self-check invariants
        run: npm test

      # 守护：L1..L10 各层的 181 个单元测试。
      # 必须用裸 `node --test` 自动发现，不可传目录参数（传目录会被当单文件执行而假红）。
      - name: 分层单元测试 / Layer unit tests
        run: npm run test:layers

      # 守护：十层重构后与 v11 旧单体（src/legacy/flagship-engine.v11.js）逐位零回归。
      # R1 参数 / R2 前向 / R3 反向 / R4 训练 / R5 生成 / R6 KV 增量 /
      # R7 存档往返 / R8 量化 / R9 逐算子 / R10 探针快照，全部要求 maxΔ=0。
      - name: 零回归门禁 / Zero-regression vs v11
        run: npm run regression

      # 守护：11 个功能探针（v3 多架构 / v4 GQA / v5 INT8 权重 / v7 MoE /
      # v8 MoE×INT8 / v9 SWA / v10 层交错 / v11 Gemma2 稳定化 / v12 KV-INT8 /
      # v13 StreamingLLM / v14 YaRN）端到端全绿，确保十层接管没有丢能力。
      - name: 全量探针 / All probes
        run: npm run test:all

      # 守护：demo 构建链可用（把引擎+自检套件+应用内联进单文件 demo.html）。
      # 这是"浏览器 file:// 双击直开"这条对外承诺的构建期证明。置于 test:all 之后、
      # probe-demo 之前，确保浏览器产物新鲜。
      - name: Demo 构建链 / Build demo.html
        run: npm run build

      - name: MoE x INT8 combined probe
        run: node scripts/probe-moe-quant.js

      - name: Sliding-Window Attention (SWA) probe
        run: node scripts/probe-swa.js

      - name: Interleaved sparse attention (Gemma-style) probe
        run: node scripts/probe-gemma.js

      - name: Gemma-2 stabilizers (QK-norm + logit soft-cap) probe
        run: node scripts/probe-gemma2.js

      - name: KV Cache INT8 quantization probe
        run: node scripts/probe-kvquant.js

      - name: Attention Sink / StreamingLLM probe
        run: node scripts/probe-streaming.js

      - name: YaRN length extrapolation probe
        run: node scripts/probe-yarn.js

      - name: Micro-ISA gate (L10 1024 slots / 192 impl / invariant sweep / engine zero-impact)
        run: node scripts/probe-microisa.js

      - name: Browser assembly gate (demo.html headless + dual-end bit-exact parity)
        run: node scripts/probe-demo.js

      # 真实浏览器渲染/交互门禁（v15.8）：Playwright headless Chromium 直开 demo.html（file://，
      # 与用户双击打开同一条路径），断言十层栈装配 + L10 1024/1024 + 微指令浏览器 DOM 渲染 /
      # 按域筛选 / 批量试运行（1024×8 谓词全绿），并产出 docs/demo-screenshot.png 作可视化留痕。
      # 浏览器二进制按 package-lock 哈希缓存，避免每次重下 ~130MB Chromium。
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser demo gate (headless render + interaction + L10 1024x8)
        run: npm run test:demo-browser

      - name: Upload demo screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-screenshot-node-${{ matrix.node }}
          path: docs/demo-screenshot.png
          if-no-files-found: warn

      - name: Unified benchmark report (bench.js → docs/BENCHMARK.md)
        run: node scripts/bench.js

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-node-${{ matrix.node }}
          path: docs/BENCHMARK.md
          if-no-files-found: warn

      - name: Assert runtime dependency count == 0
        run: |
          DEPS=$(node -e "console.log(Object.keys(require('./package.json').dependencies||{}).length)")
          echo "dependencies.length = $DEPS"
          test "$DEPS" = "0"
