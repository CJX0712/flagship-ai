name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Benchmark (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Self-check suite (12 invariants)
        run: node src/verify.js

      - name: Architecture comparison probe
        run: node scripts/probe-v3.js

      - name: GQA (Grouped-Query Attention) probe
        run: node scripts/probe-v4-gqa.js

      - name: INT8 weight-only quantization probe
        run: node scripts/probe-v5-quant.js

      - name: MoE (Mixture of Experts) probe
        run: node scripts/probe-moe.js

      - name: MoE x INT8 combined probe
        run: node scripts/probe-moe-quant.js

      - name: Sliding-Window Attention (SWA) probe
        run: node scripts/probe-swa.js

      - name: Unified benchmark report (bench.js → docs/BENCHMARK.md)
        run: node scripts/bench.js

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-node-${{ matrix.node }}
          path: docs/BENCHMARK.md
          if-no-files-found: warn
