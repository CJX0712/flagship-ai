name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Benchmark (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Self-check suite (12 invariants)
        run: node src/verify.js

      - name: Architecture comparison probe
        run: node scripts/probe-v3.js

      - name: GQA (Grouped-Query Attention) probe
        run: node scripts/probe-v4-gqa.js
