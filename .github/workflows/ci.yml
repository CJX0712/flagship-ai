name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Benchmark (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install devDependencies
        run: npm install --no-audit --no-fund

      - name: Self-check suite (12 invariants)
        run: node src/verify.js

      - name: Layer lint (no browser-hostile syntax in src/L*/**)
        run: node scripts/lint-layers.js

      - name: Zero-regression gate (v11 ↔ v12, R1–R10)
        run: node scripts/regression-v11.js --emit-golden

      - name: Architecture comparison probe
        run: node scripts/probe-v3.js

      - name: GQA (Grouped-Query Attention) probe
        run: node scripts/probe-v4-gqa.js

      - name: INT8 weight-only quantization probe
        run: node scripts/probe-v5-quant.js

      - name: MoE (Mixture of Experts) probe
        run: node scripts/probe-moe.js

      - name: MoE x INT8 combined probe
        run: node scripts/probe-moe-quant.js

      - name: Sliding-Window Attention (SWA) probe
        run: node scripts/probe-swa.js

      - name: Interleaved sparse attention (Gemma-style) probe
        run: node scripts/probe-gemma.js

      - name: Gemma-2 stabilizers (QK-norm + logit soft-cap) probe
        run: node scripts/probe-gemma2.js

      - name: Unified benchmark report (bench.js → docs/BENCHMARK.md)
        run: node scripts/bench.js

      - name: Upload benchmark report artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-node-${{ matrix.node }}
          path: docs/BENCHMARK.md
          if-no-files-found: warn

      - name: Assert runtime dependency count == 0
        run: |
          DEPS=$(node -e "console.log(Object.keys(require('./package.json').dependencies||{}).length)")
          echo "dependencies.length = $DEPS"
          test "$DEPS" = "0"
